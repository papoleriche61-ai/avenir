// ✅ Vérifie et crédite les revenus journaliers
async function verifierEtCrediterGains(uid){
    try{
        const aujourdHui = new Date().toISOString().split('T')[0];
        const qAchats = query(collection(fs,"purchases"), where("uid","==",uid));
        const snapAchats = await getDocs(qAchats);
        
        for(const docAchat of snapAchats.docs){
            const achat = {id: docAchat.id, ...docAchat.data()};
            const joursRestants = achat.daysLeft ?? 31;
            if(joursRestants <= 0) continue;
            
            const qGains = query(collection(fs,"gains"), 
                where("uid","==",uid),
                where("purchaseId","==",achat.id),
                where("date","==",aujourdHui)
            );
            const snapGains = await getDocs(qGains);
            
            if(snapGains.empty){
                await runTransaction(fs, async t=>{
                    const userRef = doc(fs,"users",uid);
                    const userSnap = await t.get(userRef);
                    const soldeActuel = userSnap.exists() ? (userSnap.data().bal || 0) : 0;
                    t.update(userRef, { bal: soldeActuel + achat.d });
                    t.set(doc(collection(fs,"gains")), {
                        uid: uid, purchaseId: achat.id, montant: achat.d,
                        nom: achat.n, date: aujourdHui, ts: Date.now()
                    });
                    const achatRef = doc(fs,"purchases",achat.id);
                    t.update(achatRef, { daysLeft: joursRestants - 1 });
                });
            }
        }
    }catch(e){console.error("Erreur crédit gains :", e);}
}

const pages={
signup:()=>`<h1>Avenir Capital</h1><p class="mu">Créez votre compte pour commencer à investir.</p><div class="card"><label>Nom complet</label><input id="n"><label>Numéro de téléphone</label><input id="ph" type="tel"><label>Mot de passe</label><input id="pw" type="password"><label>Code d’invitation</label><input id="rf" value="${INVITATION_CODE}" placeholder="CDYZ5"><div id="err" class="err"></div><div id="succ" class="succ"></div><button class="btn" onclick="signup()">S’inscrire</button></div><button class="btn sec" onclick="go('login')">J’ai déjà un compte</button>`,
login:()=>`<h1>Avenir Capital</h1><div class="card"><label>Numéro de téléphone</label><input id="ph" type="tel"><label>Mot de passe</label><input id="pw" type="password"><div id="err" class="err"></div><button class="btn" onclick="login()">Se connecter</button></div><button class="btn sec" onclick="go('signup')">Créer un compte</button>`,
home:()=>{const u=U();return`<h2>Bonjour ${esc(u.name)} 👋</h2><div class="hero"><small>Solde disponible</small><b>${F(u.bal)}</b></div>
<div class="banner-bonus" onclick="reclamerBonus()">
    <span style="font-size:28px">🎁</span>
    <h3 style="margin:8px 0 4px">Bonus de Bienvenue !</h3>
    <p style="margin:0;opacity:0.9;font-size:14px">Clique ici pour réclamer ton bonus exclusif</p>
</div>
<div class="grid"><button onclick="go('recharge')">➕<br>Recharger</button><button onclick="go('withdraw')">💸<br>Retirer</button><button onclick="go('invest')">📈<br>Investir</button><button onclick="go('bonus')">🎁<br>Bonus</button></div>
<button class="li" onclick="go('histRec')">Historique des recharges <span>›</span></button><button class="li" onclick="go('histRet')">Historique des retraits <span>›</span></button><button class="li" onclick="go('histGain')">Historique des gains <span>›</span></button>`},

bonus:()=>`${back("home")}<h2>🎁 Réclamer mon Bonus</h2>
<div class="card" style="text-align:center;padding:24px">
    <span style="font-size:60px">🎁</span>
    <h3 style="margin:16px 0 8px">Tu as droit à un bonus !</h3>
    <p class="mu" style="margin-bottom:20px">Contacte notre équipe sur WhatsApp pour recevoir ton bonus de bienvenue. Nous sommes là pour t'aider !</p>
    <a class="btn bonus" style="display:block;text-decoration:none" href="${SUPPORT}" target="_blank" rel="noopener">💬 Réclamer mon bonus sur WhatsApp</a>
    <p class="mu" style="margin-top:16px;font-size:13px">Tu seras redirigé vers notre service client</p>
</div>`,

invest:()=>`<h2>Investir</h2>`+VIP.map((v,i)=>`<div class="card"><div class="row"><b>${v.n}</b><b>${F(v.p)}</b></div><p class="mu">Revenu : ${F(v.d)} chaque jour pendant 31 jours<br>Total : ${F(v.d*31)}</p><button class="btn" onclick="buy(${i})">Investir</button></div>`).join("")+`<div id="err" class="err"></div>`,
achats:()=>{const b=U().buys;return`<h2>Mes achats</h2>`+(b.length?b.map(x=>`<div class="card"><div class="row"><b>${x.n}</b><span class="tag ${x.daysLeft>0?'pr':''}">${x.daysLeft>0?`Actif · ${x.daysLeft} jours restants`:'Terminé'}</span></div><div class="mu">Investi : ${F(x.p)} · ${F(x.d)}/jour<br>Acheté le ${x.t}</div></div>`).join(""):`<p class="mu">Aucun achat pour le moment.</p>`)},
team:()=>{const u=U(),n=teamN;return`<h2>Mon équipe</h2><div class="card"><p class="mu">Votre code d’invitation</p><div class="num">${INVITATION_CODE}</div><p class="mu">Membres invités : <b>${n}</b></p></div>`},
histGain:()=>`<h2>Historique des gains</h2>`+(gains.length?gains.map(x=>`<div class="card row"><div><b>+${F(x.montant)}</b><div class="mu">${x.n} · ${x.date}</div></div><span class="tag pr">Crédité</span></div>`).join(""):`<p class="mu">Aucun gain pour le moment. Reviens demain !</p>`),
account:()=>{const u=U();return`<h2>Mon compte</h2><div class="card"><b>${esc(u.name)}</b><div class="mu">${esc(me.phone)} · Solde ${F(u.bal)}</div></div>`+[["histRec","Historique des recharges"],["histRet","Historique des retraits"],["histGain","Historique des gains"],["achats","Mes achats"],["team","Équipe"],["bonus","🎁 Réclamer un bonus"],["link","Lier mon compte de retrait"],["card","Ma méthode de paiement"],["service","Service client"]].map(x=>`<button class="li" onclick="go('${x[0]}')">${x[1]} <span>›</span></button>`).join("")+`<button class="btn out" onclick="logout()">Se déconnecter</button>`},
recharge:()=>`${back()}<h2>Recharger</h2><div class="card"><label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric" value="${T.amt||""}"><div class="chips">${[5000,10000,50000,100000].map(v=>`<button onclick="a.value=${v}">${v.toLocaleString("fr-FR")}</button>`).join("")}</div><div id="err" class="err"></div><button class="btn" onclick="toMethod()">Confirmer</button></div>`,
method:()=>`${back("recharge")}<h2>Choisir la méthode</h2><p class="mu">Montant : <b>${F(T.amt)}</b></p>`+METH.map(m=>m=="Wave"?`<button class="li wave" onclick="go('pay')"><b>Wave</b><span>›</span></button>`:`<button class="li off" onclick="err('${m} : indisponible pour le moment. Utilisez Wave.')"><b>${m}</b><span>Indisponible</span></button>`).join("")+`<div id="err" class="err"></div>`,
pay:()=>`${back("method")}<h2>Paiement Wave</h2><div class="card wave"><p class="mu">Copiez le numéro et effectuez votre paiement de <b>${F(T.amt)}</b></p><div class="row"><span class="num">${WAVE_NUM}</span><button class="btn sec" style="width:auto;padding:10px 14px" onclick="copyN()" id="cp">Copier</button></div></div><div class="card"><label>Votre numéro de paiement</label><input id="pn" type="tel"><label>ID de la transaction</label><input id="tx"><div id="err" class="err"></div><button class="btn" onclick="confirmPay()">Confirmer le paiement</button></div>`,
histRec:()=>`${back("account")}<h2>Historique des recharges</h2>`+hist(U().recs,"Aucune recharge."),
withdraw:()=>{const c=U().card;return`${back()}<h2>Retirer</h2><div class="card"><p class="mu">Solde : ${F(U().bal)}</p><label>Montant (minimum 1 000 F)</label><input id="a" type="number" inputmode="numeric"><label>Votre numéro</label><input id="pn" type="tel" value="${c?esc(c.num):""}"><div id="err" class="err"></div><button class="btn" onclick="doWd()">Confirmer le retrait</button></div>`},
histRet:()=>`${back("account")}<h2>Historique des retraits</h2>`+hist(U().rets,"Aucun retrait."),
link:()=>`${back("account")}<h2>Lier mon compte de retrait</h2><div class="card"><label>Méthode</label><select id="m">${METH.map(m=>`<option>${m}</option>`).join("")}</select><label>Numéro</label><input id="pn" type="tel"><div id="err" class="err"></div><button class="btn" onclick="doLink()">Confirmer</button></div>`,
card:()=>{const c=U().card;return`${back("account")}<h2>Ma méthode de paiement</h2>`+(c?`<div class="hero"><small>${esc(c.m)}</small><b>${esc(c.num)}</b><small>${esc(U().name)}</small></div>`:`<p class="mu">Aucune méthode liée.</p><button class="btn" onclick="go('link')">Lier un compte</button>`)},
service:()=>`${back("account")}<h2>Service client</h2><div class="card"><p class="mu">Une question ? Écrivez-nous sur WhatsApp.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${SUPPORT}" target="_blank" rel="noopener">💬 Contacter sur WhatsApp</a><p class="mu" style="margin-top:10px">Disponible tous les jours.</p></div>`
};

function render(){
 const app=document.getElementById("app"),n=document.getElementById("nav");
 if(loading){app.innerHTML='<p class="mu">Chargement…</p>';n.style.display="none";return}
 if(!U()&&P!="login")P="signup";
 if(U()&&(P=="signup"||P=="login"))P="home";
 app.innerHTML=pages[P]();
 const tabs=[["home","🏠","Accueil"],["invest","📈","Investir"],["achats","🧾","Achats"],["bonus","🎁","Bonus"],["account","👤","Compte"]];
 n.style.display=U()?"flex":"none";
 n.innerHTML=tabs.map(t=>`<button class="${t[0]==P?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
}

onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];ud=null;recs=[];rets=[];buys=[];gains=[];teamN=0;
 if(!u){loading=false;P="login";render();return}
 verifierEtCrediterGains(u.uid);
 
 const L=(c,set)=>unsubs.push(onSnapshot(query(collection(fs,c),where("uid","==",u.uid)),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0)));render()}));
 
 unsubs.push(onSnapshot(doc(fs,"users",u.uid),s=>{if(s.exists()){ud={...s.data(),id:u.uid};loading=false;
  if(!unsubs.team){unsubs.team=1;unsubs.push(onSnapshot(query(collection(fs,"users"),where("ref","==",INVITATION_CODE)),q=>{teamN=q.size;render()}))}
  render()}}));
 
 L("recharges",x=>recs=x);
 L("withdrawals",x=>rets=x);
 L("purchases",x=>buys=x);
 L("gains",x=>gains=x);
});

async function signup(){const n=$("n"),p=$("ph"),w=$("pw"),r=$("rf")||INVITATION_CODE;
 if(!n||p.length<8||w.length<6)return err("Remplissez tous les champs (mot de passe : 6 caractères minimum).");
 try{const c=await createUserWithEmailAndPassword(auth,em(p),w);
  await setDoc(doc(fs,"users",c.user.uid),{name:n,phone:p,bal:0,ref:r,card:null,ts:Date.now()})}catch(e){err(msg(e))}}

async function login(){try{await signInWithEmailAndPassword(auth,em($("ph")),$("pw"))}catch(e){err(msg(e))}}
function logout(){signOut(auth)}

async function buy(i){const v=VIP[i],ref=doc(fs,"users",auth.currentUser.uid);
 try{await runTransaction(fs,async t=>{
  const userSnap = await t.get(ref);
  const soldeActuel = userSnap.exists() ? (userSnap.data().bal || 0) : 0;
  if(soldeActuel < v.p) throw {message:"Solde insuffisant. Rechargez votre compte."};
  t.update(ref, { bal: soldeActuel - v.p });
  t.set(doc(collection(fs,"purchases")),{uid: auth.currentUser.uid,n: v.n,p: v.p,d: v.d,t: D(),ts: Date.now(),daysLeft: 31});
 });
 go("achats");
 alert("✅ Investissement réussi ! Ton premier revenu sera crédité demain.");
}catch(e){err(e.message)}}

function toMethod(){const a=+$("a");if(a<1000)return err("Montant minimum : 1 000 F.");T.amt=a;go("method")}
function copyN(){try{navigator.clipboard.writeText(WAVE_NUM)}catch(e){}document.getElementById("cp").textContent="Copié ✓"}

async function confirmPay(){const p=$("pn"),t=$("tx");if(p.length<8||t.length<4)return err("Entrez votre numéro et l'ID de transaction.");
 try{await addDoc(collection(fs,"recharges"),{uid:auth.currentUser.uid,a:T.amt,m:"Wave · "+esc(p)+" · ID "+esc(t),pn:p,tx:t,t:D(),ts:Date.now(),s:"En attente"});go("histRec");alert("✅ Demande enregistrée ! Le solde sera crédité après vérification.");}catch(e){err(msg(e))}}

async function doWd(){const a=+$("a"),p=$("pn"),ref=doc(fs,"users",auth.currentUser.uid);if(a<1000)return err("Montant minimum : 1 000 F.");if(p.length<8)return err("Entrez un numéro valide.");
 try{await runTransaction(fs,async t=>{const b=(await t.get(ref)).data().bal;if(b<a)throw{message:"Solde insuffisant."};
  t.update(ref,{bal:b-a});t.set(doc(collection(fs,"withdrawals")),{uid:auth.currentUser.uid,a:a,m:esc(p),pn:p,t:D(),ts:Date.now(),s:"En attente"})});go("histRet");alert("✅ Demande de retrait envoyée !");}catch(e){err(e.message)}}

async function doLink(){const p=$("pn");if(p.length<8)return err("Entrez un numéro valide.");
 await setDoc(doc(fs,"users",auth.currentUser.uid),{card:{m:$("m"),num:p}},{merge:true});go("card");alert("✅ Compte lié avec succès !");}

Object.assign(window,{go,err,succ,signup,login,logout,buy,toMethod,copyN,confirmPay,doWd,doLink,reclamerBonus});
render();
</script></body></html>
