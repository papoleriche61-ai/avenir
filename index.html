function formatTimeLeft(ms){
  if(ms<=0) return "En cours de versement...";
  const h=Math.floor(ms/(60*60*1000));
  const m=Math.floor((ms%(60*60*1000))/60000);
  return `${h}h ${m}m`;
}

// Traitement automatique des gains
async function autoProcessGains(user, purchases) {
  if (isProcessingGains || !user || !purchases || !purchases.length) return;
  isProcessingGains = true;

  const now = Date.now();
  for (const p of purchases) {
    const claimedDays = Number(p.claimedDays) || 0;
    const duree = Number(p.duree) || 0;

    if (claimedDays >= duree) continue;

    const lastClaim = p.lastClaimTs || p.ts;
    const elapsed = now - lastClaim;

    if (elapsed >= ONE_DAY) {
      const possibleDays = Math.floor(elapsed / ONE_DAY);
      const daysToClaim = Math.min(possibleDays, duree - claimedDays);

      if (daysToClaim > 0) {
        const jourRevenu = Number(p.jourRevenu) || 0;
        const totalGain = daysToClaim * jourRevenu;
        const newLastClaimTs = lastClaim + (daysToClaim * ONE_DAY);

        try {
          await runTransaction(fs, async (t) => {
            const userRef = doc(fs, "users", user.uid);
            const purchaseRef = doc(fs, "purchases", p.id);

            const userSnap = await t.get(userRef);
            const purchaseSnap = await t.get(purchaseRef);

            if (userSnap.exists() && purchaseSnap.exists()) {
              const currentBal = Number(userSnap.data().bal || 0);
              const pData = purchaseSnap.data();
              const pClaimed = Number(pData.claimedDays || 0);

              if (pClaimed < duree) {
                t.update(userRef, { bal: currentBal + totalGain });
                t.update(purchaseRef, {
                  claimedDays: pClaimed + daysToClaim,
                  lastClaimTs: newLastClaimTs
                });
              }
            }
          });
        } catch (e) {
          console.error("Erreur crédit automatique:", e);
        }
      }
    }
  }
  isProcessingGains = false;
}

 n.innerHTML=tabs.map(t=>`<button class="${t[0]==P?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
}

onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];ud=null;recs=[];rets=[];buys=[];teamN=0;
 if(!u){loading=false;P="login";render();return}
 const L=(c,set)=>unsubs.push(onSnapshot(query(collection(fs,c),where("uid","==",u.uid)),s=>{
   set(s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.ts-a.ts));
   render();
 }));
 unsubs.push(onSnapshot(doc(fs,"users",u.uid),s=>{if(s.exists()){ud={...s.data(),id:u.uid};loading=false;
  if(!unsubs.team){unsubs.team=1;unsubs.push(onSnapshot(query(collection(fs,"users"),where("ref","==",INVITATION_CODE)),q=>{teamN=q.size;render()}))}
  render();
 }}));
 L("recharges",x=>recs=x);
 L("withdrawals",x=>rets=x);
 L("purchases",x=>{
   buys=x;
   if(auth.currentUser) autoProcessGains(auth.currentUser, buys);
 });
});

async function signup(){
 const n=$("n"),p=$("ph"),w=$("pw"),r=$("rf")||INVITATION_CODE;
 if(!n||p.length<8||w.length<6)return err("Remplissez tous les champs (6 caractères min pour le mot de passe).");
 try{const c=await createUserWithEmailAndPassword(auth,em(p),w);
  await setDoc(doc(fs,"users",c.user.uid),{name:n,phone:p,bal:0,ref:r,card:null,ts:Date.now()})}catch(e){err(msg(e)
